packages:
  - '.'
  - '../../observability/logger'
  - '../site-primitives'
  - '../site-primitives/packages/sitemap'
  - 'site'
  - 'packages/*'
preferWorkspacePackages: true
linkWorkspacePackages: true
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  svelte-preprocess: true
overrides:
  '@sveltejs/kit': ^2.70.2
  'brace-expansion@5': ^5.0.9
  cookie: ^0.7.2
  dompurify: ^3.4.13
  esbuild: ^0.28.1
  immutable: ^5.1.8
  'js-yaml@3': ^3.15.1
  lodash-es: ^4.17.24
  mermaid: ^11.16.1
  'nanoid@3': ^3.3.18
  postcss: ^8.5.23
  uuid: ^11.1.1
peerDependencyRules:
  allowedVersions:
    madge>typescript: ^5.4.4 || ^6.0.0
